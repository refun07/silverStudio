version: '3.5'

services:
    epikcart:
        restart: always
        build:
            context: .
            dockerfile: ./Dockerfile
        container_name: epikcart
        entrypoint: sh -c "npm install --legacy-peer-deps && npm run build && composer update && php artisan migrate && apache2-foreground"
        ports:
            - 8080:80
        volumes:
            - ./:/var/www/html
